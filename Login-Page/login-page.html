<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="style/right-style.css">

    <title>Login</title>
<style> 

body, html {
    height: 100%; 
    margin: 0;
}

body {
    display: flex;
    justify-content: center;  
    align-items: center;       
}
    p{
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }

    .radius-10{
        border-radius: 10px;
        overflow: hidden; 
        border: 1px solid #ccc; 
    }
    .custom-container{
        width: 100%;
        height: 100%;
    }
    .a{
        background-color: #0F0F0F;
    }
    .b{
        background-color:#F8F8F8;
    }

    .hight-100{
        height: 100%;
    }
   
</style>

</head>

<body>
    <div class="container-fluid  custom-container">
        <div class="row radius-10 hight-100">
            <div class="col-12 col-lg-6 a">
                a
            </div>
            <div class="col-12 col-lg-6 right-custom-grid b ">
                <div class="menu-box-custom">

                        <button class="menu-login">
                            Masuk
                        </button>
                        <button class="menu-daftar">
                            Daftar
                        </button>
                     
                </div>
                <div class="login-box-custom">

                    <div class="h1">
                         <p>Selamat datang kembali</p>
                    </div>

                    <div class="h2">
                        <p>
                            Masuk ke akun Rohman Trans milikmu
                        </p>
                    </div>
                    <div class="row">
                        <div class="col-12 col-sm-6 col-lg-12 input-css">
                        <p>EMAIL</p>
                        <input type="text" placeholder="nama@gmail.com">
                    </div>

                    <div class="col-12 col-sm-6 col-lg-12 input-css">
                        <p>
                            PASSWORD
                        </p>
                        <input type="text" placeholder="Masukan Password" >
                        <p class="right-text">
                            Lupa Password
                        </p>
                    </div>
                    </div>

                    <div class="cta-css">
                        <button>
                            <p>Masuk Ke Akun </p>
                        </button>
                    </div>

                    <div class="divider">
                        <span>atau</span>
                    </div>

                    <button class="google-btn">
                        <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg" alt="Google Logo">

                        <span>Lanjutkan dengan Google</span>
                    </button>


                    <div class="to-registration">
                        <p>
                            Belum punya akun? <span>Daftar Sekarang</span>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
